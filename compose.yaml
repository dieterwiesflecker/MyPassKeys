services:
  db:
    image: postgres:18
    restart: always
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      # Mount at the parent (not /data) so the named volume holds the whole datadir.
      - pgdata:/var/lib/postgresql
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    restart: always
    ports:
      - "6379:6379"
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-}"]
    volumes:
      - redisdata:/data
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mypasskeys:
    image: mypasskeys
    build:
      context: .
      dockerfile: MyPassKeys/Dockerfile
    restart: always
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__Postgres=Host=db;Database=${POSTGRES_DB:-mypasskeys};Username=${POSTGRES_USER:-mypasskeys};Password=${POSTGRES_PASSWORD:-}
      - ConnectionStrings__Redis=redis:6379,password=${REDIS_PASSWORD:-}
      - Resend__ApiKey=${RESEND_API_KEY:-}
      # KEK for signing-key encryption at rest — required, the app refuses to start without it.
      - MyPassKeys__KeyEncryptionKey=${KEY_ENCRYPTION_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

volumes:
  pgdata:
  redisdata:

networks:
  internal:
    driver: bridge
