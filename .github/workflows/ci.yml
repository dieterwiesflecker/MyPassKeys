name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore MyPassKeys.sln

      - name: Build
        run: dotnet build MyPassKeys.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test MyPassKeys.Tests/MyPassKeys.Tests.csproj --configuration Release --no-build --verbosity normal
